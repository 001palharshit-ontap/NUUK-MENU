<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d2b20">
<title>NUUK — Your Daily Ritual</title>

<style>
:root{--green:#0d2b20;--cream:#f7f0e3;--tan:#dfc49a;--ink:#18201c;--muted:#6e756f;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:#eee9df;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 35px #0002}

header{background:var(--green);color:white;padding:26px 20px 22px;position:sticky;top:0;z-index:10}
.brand{font-size:42px;font-weight:900;letter-spacing:3px}
.tag{letter-spacing:3px;font-size:11px;opacity:.8;margin-top:2px}
.topline{display:flex;justify-content:space-between;align-items:end}
.leaf{font-size:28px}
.search{margin-top:18px;background:#ffffff18;border:1px solid #ffffff35;border-radius:14px;padding:12px 14px;color:white;width:100%;outline:none}
.search::placeholder{color:#ffffffaa}

.hero{padding:22px 18px 8px}
.hero h1{font-family:Georgia,serif;font-size:30px;margin:0 0 7px}
.hero p{color:var(--muted);margin:0;line-height:1.5;font-size:14px}

.chips{display:flex;gap:8px;overflow:auto;padding:16px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid #cfc5b3;background:#fff8;border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:12px}
.chip.active{background:var(--green);color:white;border-color:var(--green)}

.section{padding:12px 18px}
.section-title{display:flex;align-items:center;gap:10px;margin:8px 0 13px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center}
.section-title h2{margin:0;font-family:Georgia,serif;font-size:23px}
.line{height:1px;background:#cfc5b3;flex:1}

.card{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px dashed #cfc5b3}
.info{flex:1}
.name{font-weight:700;font-size:15px}
.desc{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
.price{font-weight:800;white-space:nowrap;font-size:14px}
.veg{font-size:10px;color:#286b43;margin-left:5px}
.add{margin-top:8px;border:1px solid var(--green);background:transparent;color:var(--green);border-radius:8px;padding:5px 9px;font-size:11px}

.footer{background:var(--green);color:white;padding:22px 18px;text-align:center;margin-top:18px;font-size:11px;letter-spacing:1px}
.footer div{margin:7px 0}

.cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(444px,calc(100% - 28px));background:var(--green);color:white;padding:13px 16px;border-radius:16px;display:none;justify-content:space-between;align-items:center;box-shadow:0 8px 25px #0004;z-index:20}
.cart.show{display:flex}
.order{background:#d9b77e;color:#17251d;border:0;padding:9px 13px;border-radius:10px;font-weight:800}
.noresult{padding:25px 18px;color:var(--muted);display:none}

/* ORDER POPUP */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:400px;
  background:var(--cream);
  border-radius:20px;
  padding:24px;
  box-shadow:0 15px 50px #0006;
}

.modal-title{
  font-family:Georgia,serif;
  font-size:26px;
  margin:0 0 5px;
  color:var(--green);
}

.modal-subtitle{
  color:var(--muted);
  font-size:13px;
  margin:0 0 22px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
  color:var(--ink);
}

.field input{
  width:100%;
  padding:13px 14px;
  border:1px solid #cfc5b3;
  border-radius:12px;
  background:white;
  font-size:14px;
  outline:none;
}

.field input:focus{
  border-color:var(--green);
}

.confirm{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:800;
  font-size:14px;
  margin-top:4px;
}

.cancel{
  width:100%;
  padding:11px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="topline">
    <div>
      <div class="brand">NUUK</div>
      <div class="tag">YOUR DAILY RITUAL</div>
    </div>
    <div class="leaf">◌</div>
  </div>

  <input id="search" class="search"
    placeholder="Search bowls, coffee, smoothies..."
    oninput="render()">
</header>

<div class="hero">
  <h1>Real ingredients. Bold flavours.</h1>
  <p>Fresh, wholesome food made for everyday rituals.</p>
</div>

<div class="chips" id="chips"></div>
<div id="menu"></div>
<div id="noresult" class="noresult">No menu items found.</div>

<div class="footer">
  <div>🌿 100% VEGETARIAN &nbsp; • &nbsp; NO PRESERVATIVES</div>
  <div>MADE FRESH DAILY</div>
  <div>◎ @NUUK.KANPUR</div>
</div>

</div>

<!-- CART -->
<div id="cart" class="cart">
  <div>
    <b id="count">0</b> items &nbsp; • &nbsp; ₹<b id="total">0</b>
  </div>
  <button class="order" onclick="openOrderForm()">Order on WhatsApp</button>
</div>

<!-- ORDER DETAILS POPUP -->
<div id="orderModal" class="modal">

  <div class="modal-box">

    <h2 class="modal-title">NUUK ORDER</h2>
    <p class="modal-subtitle">Please enter your details before placing the order.</p>

    <div class="field">
      <label for="guestName">GUEST NAME</label>
      <input
        id="guestName"
        type="text"
        placeholder="Enter your name"
        autocomplete="name">
    </div>

    <div class="field">
      <label for="tableNumber">TABLE NUMBER</label>
      <input
        id="tableNumber"
        type="text"
        inputmode="numeric"
        placeholder="Enter table number">
    </div>

    <button class="confirm" onclick="confirmOrder()">
      CONFIRM ORDER
    </button>

    <button class="cancel" onclick="closeOrderForm()">
      Cancel
    </button>

  </div>

</div>
